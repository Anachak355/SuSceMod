[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SuSceMod"
version = "4.0.0"
description = "Package for scenario modelling for urban land use."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name="Anasua Chakraborty", email="A.chakraborty@uliege.be" }
]
dependencies = [
  "numpy",
  "pandas",
  "rasterio",
  "matplotlib",
  "seaborn",
  "openpyxl",
  "tabulate",
  "scikit-learn",
  "scikit-image"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = { find = { where = ["."], include = ["SuSceMod*"] } }
